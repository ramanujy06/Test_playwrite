name: Run AI POC

on:
  schedule:
    - cron: "*/10 * * * *"     # runs every 10 minutes
  workflow_dispatch:

permissions:
  contents: write              # allow git push

jobs:
  run-ai-poc:
    runs-on: ubuntu-latest

    steps:
      # --------------------------
      # CHECKOUT MAIN BRANCH
      # --------------------------
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      # --------------------------
      # PYTHON SETUP
      # --------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # --------------------------
      # INSTALL DEPENDENCIES
      # --------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------
      # RUN PLAYWRIGHT AI POC
      # --------------------------
      - name: Run Playwright AI POC
        run: python ai_poc.py

      # --------------------------
      # VERIFY OUTPUT EXISTS
      # --------------------------
      - name: Verify JSON Output Exists
        run: |
          if [ ! -f AI_POC_OUTPUT.json ]; then
            echo "AI_POC_OUTPUT.json not generated!"
            exit 1
          fi

      # --------------------------
      # UPLOAD ARTIFACT
      # --------------------------
      - name: Upload JSON output as artifact
        uses: actions/upload-artifact@v3
        with:
          name: AI_POC_OUTPUT
          path: AI_POC_OUTPUT.json

      # --------------------------
      # SAFE DIRECTORY FIX
      # --------------------------
      - name: Configure safe git directory
        run: git config --global --add safe.directory /github/workspace

      # --------------------------
      # COMMIT & PUSH BACK TO MAIN
      # --------------------------
      - name: Commit updated JSON back to repository
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "github-actions"

          git add AI_POC_OUTPUT.json
          git commit -m "Updated AI_POC_OUTPUT.json from GitHub Actions run $(date)" || echo "No changes to commit"

          git pull origin main --rebase
          git push origin main

      # --------------------------
      # COMPLETE JOB
      # --------------------------
      - name: Complete job
        run: echo "✅ AI POC flow completed successfully."
