name: AI POC Scheduled Run (Every 10 Minutes)

on:
  schedule:
    - cron: "*/10 * * * *"     # Runs every 10 minutes
  workflow_dispatch:            # Allows manual trigger

jobs:
  run-ai-poc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies (Python + Playwright)
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install

      - name: Run Playwright AI POC
        run: |
          python aiPoc.py

      # ✅ Verify JSON is generated before upload  
      - name: Verify JSON Output Exists
        run: |
          if [ ! -f "AI_POC_OUTPUT.json" ]; then
            echo "ERROR: AI_POC_OUTPUT.json was not generated!"
            exit 1
          fi

      - name: Upload JSON output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_POC_OUTPUT
          path: AI_POC_OUTPUT.json

      - name: Commit updated JSON back to repository
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git add AI_POC_OUTPUT.json

          # Commit only if changed
          git diff --cached --quiet || git commit -m "Updated AI_POC_OUTPUT.json"

          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
